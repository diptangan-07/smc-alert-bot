<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRADE WITH_____ICT-DIPTANGAN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <style>
    body { background-color: #0a0d14; color: #f3f4f6; font-family: 'Inter', sans-serif; }
    .glow-cyan { text-shadow: 0 0 10px rgba(0, 242, 254, 0.6); }
    .card-bg { background: #121824; border: 1px solid #1f293d; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- LOGIN WALL (Enforced Authentication) -->
  <div id="login-wall" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0a0d14] p-4">
    <div class="card-bg p-8 rounded-2xl max-w-md w-full text-center shadow-2xl border border-cyan-500/20">
      <h1 class="text-2xl font-bold text-cyan-400 mb-2 glow-cyan">TRADE WITH_____ICT-DIPTANGAN</h1>
      <p class="text-gray-400 text-sm mb-6">Access Institutional ICT Signals & Deeepr.ai Intelligence Terminal</p>
      <button id="google-login-btn" onclick="loginWithGoogle()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
        <span>Sign in with Google</span>
      </button>
      <div id="auth-error" class="text-red-400 text-xs mt-4 hidden"></div>
    </div>
  </div>

  <!-- MAIN TERMINAL (Hidden until Logged In) -->
  <div id="main-app" class="hidden flex-1 flex flex-col h-full">
    <!-- Header Bar -->
    <header class="card-bg px-6 py-3 flex items-center justify-between border-b border-gray-800">
      <div class="flex items-center gap-3">
        <span class="text-cyan-400 font-bold text-lg tracking-wider glow-cyan">TRADE WITH_____ICT-DIPTANGAN</span>
        <span class="bg-cyan-950 text-cyan-400 text-xs px-2.5 py-1 rounded-full border border-cyan-800">Live AI Engine</span>
      </div>
      <div class="flex items-center gap-4">
        <!-- Asset Selector -->
        <select id="asset-select" class="bg-[#1a2332] text-sm text-cyan-300 border border-gray-700 rounded-lg px-3 py-1.5 focus:outline-none">
          <option value="GOLD">TVC:GOLD</option>
          <option value="QQQ">NASDAQ:QQQ</option>
          <option value="NQ">CME_MINI:NQ1!</option>
          <option value="EURUSD">EURUSD</option>
        </select>
        <button onclick="logout()" class="text-xs text-gray-400 hover:text-white">Logout</button>
      </div>
    </header>

    <!-- Content Workspace -->
    <div class="flex-1 flex overflow-hidden">
      <!-- Sidebar -->
      <aside class="w-64 card-bg p-4 flex flex-col gap-2 border-r border-gray-800">
        <button onclick="switchTab('dashboard')" class="text-left px-4 py-2.5 rounded-lg text-sm bg-cyan-500/10 text-cyan-400 font-medium">4-Lane Intelligence</button>
        <button onclick="switchTab('signals')" class="text-left px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800">Live 5M SMC Signals</button>
        <button onclick="switchTab('builder')" class="text-left px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800">Custom AI Rule Builder</button>
        <button onclick="switchTab('news')" class="text-left px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800">Global Macro News</button>
      </aside>

      <!-- Main Panels -->
      <main class="flex-1 p-6 overflow-y-auto">
        <!-- AI Strategy Prompt Box (Deeepr.ai Style) -->
        <div class="card-bg p-4 rounded-xl mb-6">
          <label class="block text-xs font-semibold text-cyan-400 mb-2 uppercase">Custom Telegram Signal Command</label>
          <div class="flex gap-2">
            <input id="user-prompt" type="text" placeholder="e.g., Gold 5M candle sweeps 4H liquidity and closes inside range, send Telegram notification" class="flex-1 bg-[#1a2332] border border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-cyan-500">
            <button onclick="sendRuleToBackend()" class="bg-cyan-500 hover:bg-cyan-400 text-black px-5 py-2 rounded-lg text-sm font-semibold">Deploy Rule</button>
          </div>
        </div>

        <!-- Dynamic Signals Display -->
        <div id="signals-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Live Alerts will render here via Backend WebSocket/API -->
        </div>
      </main>
    </div>
  </div>

  <script>
    // Firebase Setup
    const firebaseConfig = {
      apiKey: "AIzaSyBadaNtrOfcRaSskaL0kdYoOJAVhsWuY2c",
      authDomain: "trade-with-ict-diptangan.firebaseapp.com",
      projectId: "trade-with-ict-diptangan"
    };
    firebase.initializeApp(firebaseConfig);

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider)
        .then(() => {
          document.getElementById('login-wall').classList.add('hidden');
          document.getElementById('main-app').classList.remove('hidden');
        })
        .catch(err => {
          document.getElementById('auth-error').innerText = err.message;
          document.getElementById('auth-error').classList.remove('hidden');
        });
    }

    function logout() {
      firebase.auth().signOut().then(() => location.reload());
    }

    function sendRuleToBackend() {
      const rule = document.getElementById('user-prompt').value;
      alert("Custom ICT Rule Deployed to Telegram Engine: " + rule);
    }
  </script>
</body>
    </html>
